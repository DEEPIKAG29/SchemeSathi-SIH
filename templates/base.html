        function applyLanguage(lang) {
            localStorage.setItem('schemesathi_lang', lang);
            
            const curLabel = document.getElementById('lang-current-label');
            const tarLabel = document.getElementById('lang-target-label');
            if (curLabel && tarLabel) {
                if (lang === 'hi') {
                    curLabel.innerText = "हिन्दी";
                    tarLabel.innerText = "EN";
                } else {
                    curLabel.innerText = "EN";
                    tarLabel.innerText = "हिन्दी";
                }
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nDictionary[lang] && i18nDictionary[lang][key]) {
                    el.innerText = i18nDictionary[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-opt]').forEach(el => {
                const key = el.getAttribute('data-i18n-opt');
                if (i18nDictionary[lang] && i18nDictionary[lang][key]) {
                    el.innerText = i18nDictionary[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18nDictionary[lang] && i18nDictionary[lang][key]) {
                    el.setAttribute('placeholder', i18nDictionary[lang][key]);
                }
            });

            // Instant Live Triggers for all page translation scripts without reload
            if (typeof applyRecommendationsPageTranslation === 'function') applyRecommendationsPageTranslation(lang);
            if (typeof applyDetailsPageTranslation === 'function') applyDetailsPageTranslation(lang);
            if (typeof applyComparePageTranslation === 'function') applyComparePageTranslation(lang);
            if (typeof applyCalculatorPageTranslation === 'function') applyCalculatorPageTranslation(lang);
            if (typeof applyLocatorPageTranslation === 'function') applyLocatorPageTranslation(lang);
            if (typeof applyHomePageTranslation === 'function') applyHomePageTranslation(lang);
            if (typeof renderStateDropdownLocalized === 'function') renderStateDropdownLocalized(lang);
            if (typeof updateProfilePlaceholders === 'function') updateProfilePlaceholders(lang);
        }

        function togglePlatformLanguage() {
            const currentLang = localStorage.getItem('schemesathi_lang') || 'en';
            const newLang = (currentLang === 'en') ? 'hi' : 'en';
            applyLanguage(newLang);
            window.dispatchEvent(new StorageEvent('storage', { key: 'schemesathi_lang', newValue: newLang }));
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('schemesathi_lang') || 'en';
            applyLanguage(savedLang);
        });
